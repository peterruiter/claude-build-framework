<div id="root"></div>
<style>
  body { margin: 0; padding: 24px; background: var(--page-background); font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .stack { display: flex; flex-direction: column; gap: 24px; }
  .heavy { background: var(--surface-azur-heavy); padding: 24px; border-radius: var(--radius-sm); }
  .cap { color: var(--text-secondary); font-size: 12px; margin-bottom: 8px; }
</style>
<script>
  var C = window.CapgeminiZodiak;
  var h = React.createElement;

  function Demo() {
    return h('div', {className:'stack'},
      h('p', {style:{margin:0, fontSize:'16px', fontWeight:300, lineHeight:1.625, color:'var(--text-primary)'}},
        'Capgemini works with ', h(C.Link, {href:'#', underline:true}, 'clients across 50 countries'),
        ' to put technology to work. Hover to see the sweep.'),
      h('div', {className:'row'},
        h(C.Link, {href:'#'}, 'Default link'),
        h(C.Link, {href:'#', variant:'highlight'}, 'Highlight link')
      ),
      h('div', {className:'heavy'},
        h(C.Link, {href:'#', variant:'inverse'}, 'Inverse link on a heavy surface')
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
