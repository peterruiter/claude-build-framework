<!-- @dsCard group="Content" height=420 -->
<div id="root"></div>
<style>
  body { margin: 0; padding: 24px; background: var(--page-background); font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .stack { display: flex; flex-direction: column; gap: 24px; }
  .heavy { background: var(--surface-azur-heavy); padding: 24px; border-radius: var(--radius-sm); }
  .cap { color: var(--text-secondary); font-size: 12px; margin-bottom: 8px; }
</style>
<script>
  var C = window.CapgeminiZodiak;
  var h = React.createElement;

  function Demo() {
    var img = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><rect width="640" height="360" fill="%230058ab"/><circle cx="470" cy="120" r="150" fill="%2300d5d0" opacity="0.85"/><circle cx="180" cy="300" r="120" fill="%231db8f2" opacity="0.9"/></svg>');
    return h('div', {style:{maxWidth:'420px'}},
      h(C.Card, {
        image: img,
        imageAlt: '',
        eyebrow: 'Research',
        title: 'The resilient enterprise',
        href: '#',
        meta: ['18 Sep 2026', '12 min read'],
        footer: h(C.Button, {size:'sm', icon:true, href:'#'}, 'Read the report')
      }, 'How organisations are rebuilding supply chains around data, and what separates the ones that hold up under pressure.')
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
