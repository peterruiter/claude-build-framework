<div id="root"></div>
<style>
  body { margin: 0; padding: 24px; background: var(--page-background); font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .stack { display: flex; flex-direction: column; gap: 24px; }
  .heavy { background: var(--surface-azur-heavy); padding: 24px; border-radius: var(--radius-sm); }
  .cap { color: var(--text-secondary); font-size: 12px; margin-bottom: 8px; }
</style>
<script>
  var C = window.CapgeminiZodiak;
  var h = React.createElement;

  function Demo() {
    return h(C.DataTable, {
      caption: 'Open roles',
      columns: [
        {key:'role', header:'Role'},
        {key:'location', header:'Location'},
        {key:'type', header:'Contract'},
        {key:'posted', header:'Posted'}
      ],
      rows: [
        {role:'Principal Solution Architect', location:'Utrecht', type:'Permanent', posted:'18 Sep 2026'},
        {role:'Power Platform Consultant', location:'Amsterdam', type:'Permanent', posted:'12 Sep 2026'},
        {role:'Contact Center Engineer', location:'Rotterdam', type:'Contract', posted:'02 Sep 2026'}
      ]
    });
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
