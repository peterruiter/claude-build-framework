<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>App</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1a1a; --link: #0b57d0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #ececec; --link: #8ab4f8; } }
    body { margin: 0; padding: 2rem 1rem; font: 1rem/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 40rem; margin: 0 auto; }
    a { color: var(--link); }
    a:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>App</h1>
    <ul>
      <li><a href="/app/">The app</a></li>
      <li><a href="/portal/">The portal</a></li>
    </ul>
  </main>
</body>
</html>
