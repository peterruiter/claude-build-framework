<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Acme Notes</title>
<link rel="icon" href="logo.svg">
<style>
  :root { --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --accent: #10b981; --bg: #f8fafc; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: center; gap: 14px; padding: 14px 28px; background: #0f172a; color: #fff; }
  header img { height: 30px; }
  header .who { margin-left: auto; font-size: 14px; color: #cbd5e1; }
  .demo { background: #fef3c7; color: #92400e; text-align: center; padding: 6px; font-size: 14px; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px; }
  .bar { display: flex; gap: 12px; margin-bottom: 22px; }
  .bar input { flex: 1; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
  button { padding: 12px 20px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: 600 16px/1 inherit; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .note { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; cursor: pointer; }
  .note h3 { margin: 0 0 6px; font-size: 19px; }
  .note p { margin: 0 0 10px; color: #334155; }
  .note time { font-size: 13px; color: var(--muted); }
  form { display: none; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 22px; }
  form.open { display: grid; gap: 12px; }
  form label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
  form input, form textarea { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  form textarea { min-height: 90px; }
  .empty { color: var(--muted); }
  @media (max-width: 600px) { main { padding: 16px; } header { padding: 12px 16px; } .bar { flex-direction: column; } }
</style>
</head>
<body>
<header><img src="logo.svg" alt="Acme Notes"><strong>Acme Notes</strong><span class="who" id="who"></span></header>
<div class="demo" id="demo" hidden>Demonstration workspace</div>
<main>
  <div class="bar">
    <input type="search" placeholder="Search notes" id="search" aria-label="Search notes">
    <button type="button" id="new">New note</button>
  </div>
  <form id="editor">
    <label>Title <input id="title" name="title"></label>
    <label>Note <textarea id="body" name="body"></textarea></label>
    <div><button type="submit">Save</button></div>
  </form>
  <ul id="list" data-testid="notes-list"></ul>
</main>
<script>
  const load = () => { try { return JSON.parse(localStorage.getItem('acme.notes') || '[]'); } catch { return []; } };
  const save = (notes) => localStorage.setItem('acme.notes', JSON.stringify(notes));
  const ago = (iso) => { const d = Math.round((Date.now() - Date.parse(iso)) / 86400000); return d <= 0 ? 'Changed today' : d === 1 ? 'Changed yesterday' : `Changed ${d} days ago`; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const notes = load().sort((a, b) => b.changed.localeCompare(a.changed)).filter((n) => !q || (n.title + ' ' + n.body).toLowerCase().includes(q));
    document.getElementById('list').innerHTML = notes.length
      ? notes.map((n) => `<li class="note"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><time>${ago(n.changed)}</time></li>`).join('')
      : '<li class="empty">No notes yet.</li>';
  }
  document.getElementById('search').addEventListener('input', render);
  document.getElementById('new').addEventListener('click', () => { document.getElementById('editor').classList.add('open'); document.getElementById('title').focus(); });
  document.getElementById('editor').addEventListener('submit', (e) => {
    e.preventDefault();
    const title = document.getElementById('title').value.trim() || 'Untitled';
    save([...load(), { id: 'n' + Date.now(), title, body: document.getElementById('body').value, changed: new Date().toISOString() }]);
    e.target.reset(); e.target.classList.remove('open'); render();
  });
  fetch('api/profile.json').then((r) => r.json()).then((p) => {
    document.getElementById('who').textContent = `${p.name} · ${p.email}`;
    document.getElementById('demo').hidden = !p.demo;
  });
  render();
</script>
</body>
</html>
